<h2 mat-dialog-title>{{ data.title || 'Bestätigung' }}</h2>

<div mat-dialog-content>
  <p>{{ data.message || 'Bitte bestätigen.' }}</p>
</div>

<div mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">{{ data.cancelText || 'Abbrechen' }}</button>
  <button mat-flat-button color="warn" (click)="confirm()">{{ data.confirmText || 'Löschen' }}</button>
</div>
